<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Clipper — auto Shorts, offline &amp; gratis</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c5cff'/%3E%3Cpath d='M12 9v14l11-7z' fill='%230a0a10'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">C</div>
          <div>
            <div class="brand-name">Clipper</div>
            <div class="brand-sub">offline · gratis</div>
          </div>
        </div>

        <nav class="nav">
          <a href="#/new" data-nav="new"><span class="ico">✦</span> Buat Clip</a>
          <a href="#/viral" data-nav="viral"><span class="ico">🔥</span> Viral</a>
          <a href="#/projects" data-nav="projects"><span class="ico">▤</span> Project</a>
          <a href="#/youtube" data-nav="youtube"><span class="ico">▶</span> YouTube</a>
          <a href="#/settings" data-nav="settings"><span class="ico">⚙</span> Pengaturan</a>
        </nav>

        <div class="side-foot">
          <div class="chip" id="chip-ffmpeg"><span class="dot"></span> ffmpeg</div>
          <div class="chip" id="chip-whisper"><span class="dot"></span> Whisper lokal</div>
          <div class="chip" id="chip-youtube"><span class="dot"></span> YouTube</div>
          <div class="tiny dim" style="padding: 4px 10px">v<span id="app-version">—</span> · data lokal</div>
        </div>
      </aside>

      <main class="main" id="view">
        <div class="empty"><div class="spinner"></div><div style="margin-top: 10px">Memuat Clipper…</div></div>
      </main>
    </div>

    <div id="modal-root"></div>
    <div class="toasts" id="toasts"></div>
    <script src="app.js"></script>
  </body>
</html>
